<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2027학년도 전기 신입생 모집 | 숭실대학교 가상융합대학원</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{--accent:#FE0197}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#fff}
body{font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;color:#121212;word-break:keep-all}
/* 캔버스 '인스타그램 (1080×1350)' 아트보드 그대로 */
#bn{position:absolute;left:0;top:0;width:1080px;height:1350px;padding:72px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;background:#fff;color:inherit;text-decoration:none;transform-origin:0 0}
.dfly{position:absolute;top:40px;right:0;width:620px;-webkit-mask-image:linear-gradient(to bottom,#000 78%,transparent);mask-image:linear-gradient(to bottom,#000 78%,transparent)}
.sub{position:relative;font-size:34px;font-weight:700;line-height:1.3;letter-spacing:-.01em}
.ttl{position:relative;margin-top:4px;font-size:150px;font-weight:900;line-height:1.05;letter-spacing:-.045em}
.box{position:relative;margin-top:36px;padding:36px 40px;border-radius:36px;background:var(--accent);display:flex;flex-direction:column;gap:20px}
.msg{font-size:52px;font-weight:900;line-height:1.3;letter-spacing:-.03em;color:#fff}
.hl{padding:0 12px;border-radius:12px;background:#fff;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chip{padding:10px 24px;border-radius:999px;background:#fff;font-size:30px;font-weight:700}
.to{font-size:38px;font-weight:900;letter-spacing:-.02em;color:#fff}
.row{position:relative;margin-top:44px;display:flex;align-items:center;gap:22px}
.pill{padding:12px 26px;border-radius:999px;background:#121212;color:#fff;font-size:28px;font-weight:700;white-space:nowrap}
.date{font-size:50px;font-weight:900;letter-spacing:-.02em;color:#0078FF;white-space:nowrap}
.url{position:relative;margin-top:18px;font-size:26px;font-weight:500;color:#444}
.url b{color:#121212}

/* 애니메이션 (7초 반복): 핑크 박스 → 문구 → 과목 칩 하나씩 → 화살표 문구 */
.a{animation-duration:7s;animation-iteration-count:infinite;animation-timing-function:ease-out;animation-fill-mode:both}
.box.a{animation-name:boxIn}
@keyframes boxIn{0%{opacity:0;transform:translateY(24px) scale(.97)}9%{opacity:1;transform:none}96%{opacity:1;transform:none}100%{opacity:0;transform:none}}
@media (prefers-reduced-motion:reduce){.a{animation:none!important;opacity:1!important;transform:none!important}}
</style>
</head>
<body>
<a id="bn" href="education.html" target="_top" aria-label="2027학년도 전기 신입생 모집 — 입학 안내 보기">
<img class="dfly" src="assets/banner-dragonfly.webp" alt="">
<div class="sub">숭실대학교 가상융합대학원 · 2027학년도 전기</div>
<div class="ttl">신입생 모집</div>
<div class="box a">
<div class="msg a" data-in="0.7"><span class="hl">전공과 관계없이</span> 누구나 지원</div>
<div class="chips"><span class="chip a" data-in="1.4">인문</span><span class="chip a" data-in="1.7">사회</span><span class="chip a" data-in="2.0">예술</span><span class="chip a" data-in="2.3">디자인</span><span class="chip a" data-in="2.6">공학</span><span class="chip a" data-in="2.9">자연과학</span></div>
<div class="to a" data-in="3.3">→ XR · AI · 콘텐츠 융합 연구</div>
</div>
<div class="row"><span class="pill">원서 접수</span><span class="date">2026.10.06(화) – 10.16(금)</span></div>
<div class="url">모집요강 · 온라인 입학지원 <b>grad.ssu.ac.kr</b></div>
</a>
<script>
(function(){
 // 창 너비에 맞춰 1080×1350 배너를 확대·축소
 var b=document.getElementById('bn');
 function fit(){b.style.transform='scale('+(window.innerWidth/1080)+')'}
 fit();window.addEventListener('resize',fit);
 // 요소마다 등장 시점(data-in, 초)을 7초 주기 안의 %로 바꿔 키프레임 생성
 var T=7,css='';
 document.querySelectorAll('[data-in]').forEach(function(el,i){
  var s=+el.getAttribute('data-in')/T*100,e=s+0.45/T*100,n='in'+i;
  css+='@keyframes '+n+'{0%,'+s.toFixed(2)+'%{opacity:0;transform:translateY(10px)}'+e.toFixed(2)+'%,96%{opacity:1;transform:none}100%{opacity:0}}';
  el.style.animationName=n;
 });
 var st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
})();
</script>
</body>
</html>
