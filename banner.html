<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2027학년도 전기 신입생 모집 | 숭실대학교 가상융합대학원</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{--accent:#FE0197;--blue:#0078FF;--ink:#121212}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#fff}
body{font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;color:var(--ink);word-break:keep-all}
a.bn{display:block;color:inherit;text-decoration:none;transform-origin:0 0;position:absolute;left:0;top:0;overflow:hidden;background:#fff}
.bn .rel{position:relative}
.dfly{position:absolute;right:0;-webkit-mask-image:linear-gradient(to bottom,#000 80%,transparent);mask-image:linear-gradient(to bottom,#000 80%,transparent)}
.chip{padding:6px 14px;border-radius:999px;background:#fff;font-size:14px;font-weight:700;color:var(--ink)}
.hl{padding:0 6px;border-radius:6px;background:#fff;color:var(--accent)}
.pill{padding:8px 16px;border-radius:999px;background:var(--ink);color:#fff;font-size:16px;font-weight:700;white-space:nowrap}
.date{font-weight:900;letter-spacing:-.02em;color:var(--blue);white-space:nowrap}

/* 가로형 1140×360 */
#wide{width:1140px;height:360px;padding:32px 56px;display:flex;flex-direction:column;justify-content:center}
#wide .dfly{top:20px;width:380px}
#wide .sub{font-size:22px;font-weight:700;line-height:1.3;letter-spacing:-.01em}
#wide .ttl{margin-top:2px;font-size:76px;font-weight:900;line-height:1.05;letter-spacing:-.045em}
#wide .box{margin-top:20px;align-self:flex-start;padding:12px 22px;border-radius:18px;background:var(--accent);display:flex;flex-direction:column;gap:10px}
#wide .msg{font-size:22px;font-weight:900;line-height:1.35;letter-spacing:-.03em;color:#fff;white-space:nowrap}
#wide .chips{display:flex;align-items:center;gap:6px}
#wide .to{margin-left:12px;font-size:17px;font-weight:900;letter-spacing:-.02em;color:#fff;white-space:nowrap}
#wide .row{margin-top:20px;display:flex;align-items:center;gap:14px}
#wide .date{font-size:30px}
#wide .logo{position:absolute;height:28px;width:auto;left:887px;top:15px}

</style>
</head>
<body>
<a class="bn" id="wide" href="education.html" target="_top" aria-label="2027학년도 전기 신입생 모집 — 입학 안내 보기">
<img class="dfly" src="assets/banner-dragonfly.webp" alt="">
<div class="rel sub">숭실대학교 가상융합대학원 · 2027학년도 전기</div>
<div class="rel ttl">신입생 모집</div>
<div class="rel box">
<div class="msg"><span class="hl">전공과 관계없이</span> 누구나 지원할 수 있습니다</div>
<div class="chips"><span class="chip">인문</span><span class="chip">사회</span><span class="chip">예술</span><span class="chip">디자인</span><span class="chip">공학</span><span class="chip">자연과학</span><span class="to">→ XR · AI · 콘텐츠 융합 연구</span></div>
</div>
<div class="rel row"><span class="pill">원서 접수</span><span class="date">2026.10.06(화) – 10.16(금)</span><img class="logo" src="assets/logo.png" alt="Soongsil University 가상융합대학원"></div>
</a>

<script>
// 창 너비에 맞춰 1140×360 배너를 확대·축소합니다.
(function(){var w=document.getElementById('wide');function fit(){w.style.transform='scale('+(window.innerWidth/1140)+')'}fit();window.addEventListener('resize',fit)})();
</script>
</body>
</html>
